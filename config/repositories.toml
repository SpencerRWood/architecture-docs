# Reviewed active SpencerRWood estate for Story #521, 2026-10-06.
# Exact paths only; additions require an explicit registry review.
# Archived repositories, homelab, wood-data-platform, and website-marketing-simulation
# are excluded. References from approved repositories do not authorize collection.
version = 1
infisical_scope = "infisical.toml"

[limits]
max_file_bytes = 262144
max_files = 500
max_pages = 10

